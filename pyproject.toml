[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-station-ai-survey-assistant"
version = "0.1.0"
description = "Safety-first survey assistance with human-controlled browser authorization."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "playwright>=1.48,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.32,<1",
    "google-genai>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
